name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-build.mjs
      - name: Reject analytics scripts
        run: |
          if grep -REiq 'goatcounter|gc\.zgo\.at|google-analytics|googletagmanager|plausible\.io|posthog' dist; then
            echo 'Unexpected analytics reference in generated site'
            exit 1
          fi
